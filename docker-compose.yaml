services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./source/.env
    environment:
      PROCESS_EXECUTION_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-agent_jobs}
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_CLIENTS_COLLECTION: clients
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      MONGODB_DOMAIN_RUNS_COLLECTION: domain_runs
    ports:
      - "${API_PORT:-8110}:8110"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      selenium-hub:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "celery",
        "-A",
        "infrastructure.queue.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}",
        "--queues=${CELERY_TASK_QUEUE:-agent_jobs}",
        "--hostname=worker@%h",
      ]
    env_file:
      - ./source/.env
    environment:
      PROCESS_EXECUTION_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-agent_jobs}
      REDIS_PROCESS_HEARTBEAT_TTL_SECONDS: ${REDIS_PROCESS_HEARTBEAT_TTL_SECONDS:-7200}
      REDIS_PROCESS_HEARTBEAT_INTERVAL_SECONDS: ${REDIS_PROCESS_HEARTBEAT_INTERVAL_SECONDS:-3600}
      REDIS_PROCESS_HEARTBEAT_PREFIX: ${REDIS_PROCESS_HEARTBEAT_PREFIX:-heartbeat}
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-1800}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-3}
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_CLIENTS_COLLECTION: clients
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      MONGODB_DOMAIN_RUNS_COLLECTION: domain_runs
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      selenium-hub:
        condition: service_started
      chrome-node:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "celery",
        "-A",
        "infrastructure.queue.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    env_file:
      - ./source/.env
    environment:
      PROCESS_EXECUTION_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_QUEUE: ${CELERY_TASK_QUEUE:-agent_jobs}
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-1800}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_CLIENTS_COLLECTION: clients
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      MONGODB_DOMAIN_RUNS_COLLECTION: domain_runs
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  legacy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "tasks.worker"]
    profiles:
      - legacy-worker
    env_file:
      - ./source/.env
    environment:
      PROCESS_EXECUTION_MODE: worker
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-3}
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_CLIENTS_COLLECTION: clients
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      MONGODB_DOMAIN_RUNS_COLLECTION: domain_runs
    depends_on:
      mongo:
        condition: service_started
      selenium-hub:
        condition: service_started
      chrome-node:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  selenium-hub:
    image: selenium/hub:latest
    ports:
      - "${SELENIUM_HUB_PORT:-4445}:4444"
    environment:
      SE_SESSION_REQUEST_TIMEOUT: ${SE_SESSION_REQUEST_TIMEOUT:-600}
      SE_SESSION_RETRY_INTERVAL: ${SE_SESSION_RETRY_INTERVAL:-5}
    restart: unless-stopped

  chrome-node:
    image: selenium/node-chromium:latest
    shm_size: "${CHROME_SHM_SIZE:-2g}"
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: ${SE_NODE_MAX_SESSIONS:-1}
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_NODE_SESSION_TIMEOUT: ${SE_NODE_SESSION_TIMEOUT:-900}
      SE_BROWSER_ARGS_DISABLE_DSHM: --disable-dev-shm-usage
      SE_BROWSER_ARGS_NO_SANDBOX: --no-sandbox
    depends_on:
      selenium-hub:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secret}
    volumes:
      - ./mongo-data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    # profiles:
    #   - debug
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-secret}
      ME_CONFIG_SITE_BASEURL: /ats/mongo
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
