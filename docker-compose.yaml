services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./source/.env
    environment:
      PROCESS_EXECUTION_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_CLIENTS_COLLECTION: clients
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      MONGODB_DOMAIN_RUNS_COLLECTION: domain_runs
    ports:
      - "${API_PORT:-8110}:8110"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      selenium-hub:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "celery",
        "-A",
        "infrastructure.queue.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}",
        "--hostname=worker@%h",
      ]
    env_file:
      - ./source/.env
    environment:
      PROCESS_EXECUTION_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-3}
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_CLIENTS_COLLECTION: clients
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      MONGODB_DOMAIN_RUNS_COLLECTION: domain_runs
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      selenium-hub:
        condition: service_started
      chrome-node:
        condition: service_started
    restart: unless-stopped

  legacy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "tasks.worker"]
    profiles:
      - legacy-worker
    env_file:
      - ./source/.env
    environment:
      PROCESS_EXECUTION_MODE: worker
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-3}
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_CLIENTS_COLLECTION: clients
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      MONGODB_DOMAIN_RUNS_COLLECTION: domain_runs
    depends_on:
      mongo:
        condition: service_started
      selenium-hub:
        condition: service_started
      chrome-node:
        condition: service_started
    restart: unless-stopped

  autoscaler:
    build:
      context: .
      dockerfile: Dockerfile.autoscaler
    profiles:
      - autoscale
    env_file:
      - ./source/.env
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-job_website_monitoring_agent}
      AUTOSCALER_REDIS_URL: redis://redis:6379/0
      AUTOSCALER_REDIS_QUEUE: processes
      AUTOSCALER_COMPOSE_PROJECT_DIR: ${PWD}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      SELENIUM_STATUS_URL: http://selenium-hub:4444/status
      AUTOSCALER_POLL_SECONDS: ${AUTOSCALER_POLL_SECONDS:-15}
      AUTOSCALER_COOLDOWN_SECONDS: ${AUTOSCALER_COOLDOWN_SECONDS:-90}
      AUTOSCALER_SCALE_UP_COOLDOWN_SECONDS: ${AUTOSCALER_SCALE_UP_COOLDOWN_SECONDS:-30}
      AUTOSCALER_IDLE_SCALE_DOWN_SECONDS: ${AUTOSCALER_IDLE_SCALE_DOWN_SECONDS:-180}
      AUTOSCALER_COMPOSE_TIMEOUT_SECONDS: ${AUTOSCALER_COMPOSE_TIMEOUT_SECONDS:-30}
      AUTOSCALER_MIN_WORKERS: ${AUTOSCALER_MIN_WORKERS:-1}
      AUTOSCALER_MAX_WORKERS: ${AUTOSCALER_MAX_WORKERS:-8}
      AUTOSCALER_MIN_CHROME_NODES: ${AUTOSCALER_MIN_CHROME_NODES:-1}
      AUTOSCALER_MAX_CHROME_NODES: ${AUTOSCALER_MAX_CHROME_NODES:-16}
      AUTOSCALER_TASKS_PER_WORKER: ${AUTOSCALER_TASKS_PER_WORKER:-1}
      AUTOSCALER_CHROME_NODES_PER_WORKER: ${AUTOSCALER_CHROME_NODES_PER_WORKER:-1}
      AUTOSCALER_MAX_CPU_PERCENT: ${AUTOSCALER_MAX_CPU_PERCENT:-75}
      AUTOSCALER_MAX_MEMORY_PERCENT: ${AUTOSCALER_MAX_MEMORY_PERCENT:-80}
      AUTOSCALER_MEMORY_BUFFER_MB: ${AUTOSCALER_MEMORY_BUFFER_MB:-2048}
      AUTOSCALER_ESTIMATED_WORKER_MEMORY_MB: ${AUTOSCALER_ESTIMATED_WORKER_MEMORY_MB:-350}
      AUTOSCALER_ESTIMATED_CHROME_MEMORY_MB: ${AUTOSCALER_ESTIMATED_CHROME_MEMORY_MB:-1200}
      AUTOSCALER_CHROME_SHM_SIZE_MB: ${AUTOSCALER_CHROME_SHM_SIZE_MB:-2048}
      AUTOSCALER_MEMORY_SAFETY_FACTOR: ${AUTOSCALER_MEMORY_SAFETY_FACTOR:-1.25}
      AUTOSCALER_WORKER_HEALTH_CHECK_ENABLED: "false"
      AUTOSCALER_WORKER_HEALTH_TIMEOUT_SECONDS: ${AUTOSCALER_WORKER_HEALTH_TIMEOUT_SECONDS:-8}
      AUTOSCALER_SCALING_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - ${PWD}:${PWD}
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      selenium-hub:
        condition: service_started
    restart: unless-stopped

  infra-monitor:
    build:
      context: .
      dockerfile: Dockerfile.autoscaler
    profiles:
      - monitor
    env_file:
      - ./source/.env
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-job_website_monitoring_agent}
      AUTOSCALER_SCALING_ENABLED: "false"
      AUTOSCALER_REDIS_URL: redis://redis:6379/0
      AUTOSCALER_REDIS_QUEUE: processes
      AUTOSCALER_COMPOSE_PROJECT_DIR: ${PWD}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-job_monitoring_agent}
      MONGODB_PROCESS_UPLOADS_COLLECTION: process_uploads
      SELENIUM_STATUS_URL: http://selenium-hub:4444/status
      AUTOSCALER_POLL_SECONDS: ${INFRA_MONITOR_POLL_SECONDS:-15}
      AUTOSCALER_COMPOSE_TIMEOUT_SECONDS: ${AUTOSCALER_COMPOSE_TIMEOUT_SECONDS:-30}
      AUTOSCALER_MIN_WORKERS: ${AUTOSCALER_MIN_WORKERS:-1}
      AUTOSCALER_MAX_WORKERS: ${AUTOSCALER_MAX_WORKERS:-8}
      AUTOSCALER_MIN_CHROME_NODES: ${AUTOSCALER_MIN_CHROME_NODES:-1}
      AUTOSCALER_MAX_CHROME_NODES: ${AUTOSCALER_MAX_CHROME_NODES:-16}
      AUTOSCALER_TASKS_PER_WORKER: ${AUTOSCALER_TASKS_PER_WORKER:-1}
      AUTOSCALER_CHROME_NODES_PER_WORKER: ${AUTOSCALER_CHROME_NODES_PER_WORKER:-1}
      AUTOSCALER_MAX_CPU_PERCENT: ${AUTOSCALER_MAX_CPU_PERCENT:-75}
      AUTOSCALER_MAX_MEMORY_PERCENT: ${AUTOSCALER_MAX_MEMORY_PERCENT:-80}
      AUTOSCALER_MEMORY_BUFFER_MB: ${AUTOSCALER_MEMORY_BUFFER_MB:-2048}
      AUTOSCALER_ESTIMATED_WORKER_MEMORY_MB: ${AUTOSCALER_ESTIMATED_WORKER_MEMORY_MB:-350}
      AUTOSCALER_ESTIMATED_CHROME_MEMORY_MB: ${AUTOSCALER_ESTIMATED_CHROME_MEMORY_MB:-1200}
      AUTOSCALER_CHROME_SHM_SIZE_MB: ${AUTOSCALER_CHROME_SHM_SIZE_MB:-2048}
      AUTOSCALER_MEMORY_SAFETY_FACTOR: ${AUTOSCALER_MEMORY_SAFETY_FACTOR:-1.25}
      AUTOSCALER_WORKER_HEALTH_CHECK_ENABLED: ${AUTOSCALER_WORKER_HEALTH_CHECK_ENABLED:-true}
      AUTOSCALER_WORKER_HEALTH_TIMEOUT_SECONDS: ${AUTOSCALER_WORKER_HEALTH_TIMEOUT_SECONDS:-8}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - ${PWD}:${PWD}
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      selenium-hub:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  selenium-hub:
    image: selenium/hub:latest
    ports:
      - "${SELENIUM_HUB_PORT:-4445}:4444"
    environment:
      SE_SESSION_REQUEST_TIMEOUT: ${SE_SESSION_REQUEST_TIMEOUT:-600}
      SE_SESSION_RETRY_INTERVAL: ${SE_SESSION_RETRY_INTERVAL:-5}
    restart: unless-stopped

  chrome-node:
    image: selenium/node-chromium:latest
    shm_size: "${CHROME_SHM_SIZE:-2g}"
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: ${SE_NODE_MAX_SESSIONS:-1}
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_NODE_SESSION_TIMEOUT: ${SE_NODE_SESSION_TIMEOUT:-900}
      SE_BROWSER_ARGS_DISABLE_DSHM: --disable-dev-shm-usage
      SE_BROWSER_ARGS_NO_SANDBOX: --no-sandbox
    depends_on:
      selenium-hub:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secret}
    volumes:
      - ./mongo-data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    profiles:
      - debug
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-secret}
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
