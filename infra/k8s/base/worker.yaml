apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: job-monitoring
  labels:
    app.kubernetes.io/name: job-monitoring-agent
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-monitoring-agent
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 86400
      containers:
        - name: worker
          image: ghcr.io/your-org/job-website-monitoring-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - infrastructure.queue.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=1
            - --hostname=worker@%h
          envFrom:
            - configMapRef:
                name: job-monitoring-config
            - secretRef:
                name: job-monitoring-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
