apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome-node
  namespace: job-monitoring
  labels:
    app.kubernetes.io/name: job-monitoring-agent
    app.kubernetes.io/component: chrome-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: chrome-node
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-monitoring-agent
        app.kubernetes.io/component: chrome-node
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: chrome-node
          image: selenium/node-chromium:latest
          ports:
            - name: vnc
              containerPort: 5900
          env:
            - name: SE_EVENT_BUS_HOST
              value: selenium-hub
            - name: SE_EVENT_BUS_PUBLISH_PORT
              value: "4442"
            - name: SE_EVENT_BUS_SUBSCRIBE_PORT
              value: "4443"
          envFrom:
            - configMapRef:
                name: job-monitoring-config
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
