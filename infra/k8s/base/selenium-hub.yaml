apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-hub
  namespace: job-monitoring
  labels:
    app.kubernetes.io/name: job-monitoring-agent
    app.kubernetes.io/component: selenium-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: selenium-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-monitoring-agent
        app.kubernetes.io/component: selenium-hub
    spec:
      containers:
        - name: selenium-hub
          image: selenium/hub:latest
          ports:
            - name: http
              containerPort: 4444
            - name: publish
              containerPort: 4442
            - name: subscribe
              containerPort: 4443
          envFrom:
            - configMapRef:
                name: job-monitoring-config
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: selenium-hub
  namespace: job-monitoring
spec:
  selector:
    app.kubernetes.io/component: selenium-hub
  ports:
    - name: http
      port: 4444
      targetPort: http
    - name: publish
      port: 4442
      targetPort: publish
    - name: subscribe
      port: 4443
      targetPort: subscribe
