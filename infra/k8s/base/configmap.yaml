apiVersion: v1
kind: ConfigMap
metadata:
  name: job-monitoring-config
  namespace: job-monitoring
data:
  PROCESS_EXECUTION_MODE: "celery"
  WORKER_POLL_INTERVAL_SECONDS: "3"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  CELERY_WORKER_CONCURRENCY: "1"
  CELERY_VISIBILITY_TIMEOUT_SECONDS: "86400"
  CELERY_UNACKED_KEY: "unacked"
  BROWSER_SESSION_ACQUIRE_TIMEOUT_SECONDS: "600"
  BROWSER_SESSION_RETRY_DELAY_SECONDS: "60"
  BROWSER_SESSION_MAX_RETRIES: "1440"
  PROCESS_RECOVERY_ENABLED: "true"
  PROCESS_RECOVERY_STALE_AFTER_SECONDS: "300"
  PROCESS_RECOVERY_QUEUED_AFTER_SECONDS: "30"
  PROCESS_RECOVERY_INTERVAL_SECONDS: "60"
  PROCESS_HEARTBEAT_INTERVAL_SECONDS: "30"
  OBSERVABILITY_ENABLED: "true"
  OBSERVABILITY_REDIS_QUEUE: "processes"
  OBSERVABILITY_SELENIUM_STATUS_URL: "http://selenium-hub:4444/status"
  OBSERVABILITY_FAILURE_RATE_ALERT_THRESHOLD: "0.25"
  OBSERVABILITY_QUEUE_DEPTH_ALERT_THRESHOLD: "50"
  OBSERVABILITY_BROWSER_SATURATION_ALERT_THRESHOLD: "0.9"
  OBSERVABILITY_CACHE_TTL_SECONDS: "20"
  DEFAULT_AGENT_COUNT: "1"
  POST_NAVIGATION_DELAY_MS: "5000"
  SELENIUM_REMOTE_URL: "http://selenium-hub:4444/wd/hub"
  MONGODB_DATABASE: "job_monitoring_agent"
  MONGODB_CLIENTS_COLLECTION: "clients"
  MONGODB_PROCESS_UPLOADS_COLLECTION: "process_uploads"
  MONGODB_DOMAIN_RUNS_COLLECTION: "domain_runs"
  DEFAULT_CLIENT_NAME: "ProcessZero"
  PROCESS_EMAIL_ENABLED: "true"
  EMAIL_FROM_NAME: "ProcessZero"
  PROCESS_EMAIL_SUBJECT_PREFIX: "[ProcessZero]"
  SE_SESSION_REQUEST_TIMEOUT: "600"
  SE_SESSION_RETRY_INTERVAL: "5"
  SE_NODE_MAX_SESSIONS: "1"
  SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
  SE_NODE_SESSION_TIMEOUT: "3600"
  SE_BROWSER_ARGS_DISABLE_DSHM: "--disable-dev-shm-usage"
  SE_BROWSER_ARGS_NO_SANDBOX: "--no-sandbox"
