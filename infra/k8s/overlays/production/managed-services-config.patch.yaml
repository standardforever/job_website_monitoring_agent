apiVersion: v1
kind: ConfigMap
metadata:
  name: job-monitoring-config
  namespace: job-monitoring
data:
  # For production, prefer managed Redis and MongoDB.
  # Keep these in sync with job-monitoring-secrets.MONGODB_URI.
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  MONGODB_DATABASE: "job_monitoring_agent"
